{% extends "base.html" %}
{% block content %}
<form class="card stack" method="post" action="/children" style="max-width:560px">
  <h1>Thêm hồ sơ của con</h1>
  {% if error %}<div class="toast warn">{{ error }}</div>{% endif %}
  <input type="hidden" name="csrf_token" value="{{ web.csrf }}">
  <div class="field"><label for="nickname">Tên gọi ở nhà</label><input id="nickname" name="nickname" type="text" maxlength="20" required placeholder="vd: Bin, Na, Cún"></div>
  <p class="hint">Không cần họ tên đầy đủ (tối thiểu hóa dữ liệu).</p>
  <div class="field"><label for="self_pronoun">Con tự xưng là</label>
    <select id="self_pronoun" name="self_pronoun"><option>con</option><option>em</option><option>mình</option><option>cháu</option></select></div>
  <div class="field"><label for="birth_year">Năm sinh (chỉ năm)</label><input id="birth_year" name="birth_year" type="number" min="2005" max="2026" required value="2017"></div>
  <fieldset class="field" style="border:0;padding:0"><legend style="font-weight:700">Bạn đồng hành của con</legend>
    <div class="row">
      {% for a, label in [('tictac', 'Tíc-Tắc'), ('khien', 'Khiên Xanh'), ('sao', 'Sao Nhỏ')] %}
      <label class="check"><input type="radio" name="avatar_key" value="{{ a }}" {% if loop.first %}checked{% endif %}>
        <img src="/static/mascots/{{ a }}_happy.svg" alt="" width="40" height="40"> {{ label }}</label>
      {% endfor %}
    </div>
  </fieldset>
  <button class="btn" type="submit">Tạo hồ sơ</button>
</form>
{% endblock %}
